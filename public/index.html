<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First Month: Topmate sales game</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0f1720;--card:#16222d;--card2:#1b2a37;--ink:#e9eef3;--muted:#8a9bab;--line:#243444;--accent:#38c2b0;--accent-ink:#04211d;--gold:#f2c14e;--warn:#f08a5d;--blue:#6fa8dc;--sel:#1a4540}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:radial-gradient(900px 500px at 50% -10%,#18313f 0%,var(--bg) 60%);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45;-webkit-user-select:none;user-select:none;overflow-x:hidden}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px;min-height:100%}
h1{font-size:30px;font-weight:700;line-height:1.15;margin:0 0 8px}
h2{font-size:22px;font-weight:700;margin:0 0 6px}
p{margin:0 0 12px}.muted{color:var(--muted);font-size:14.5px}
button{font:inherit;cursor:pointer}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:15px 22px;font-size:17px;font-weight:700;width:100%;box-shadow:0 6px 0 #17a374;transform:translateY(0);transition:transform .08s,box-shadow .08s}
.primary:active{transform:translateY(4px);box-shadow:0 2px 0 #17a374}
.primary[disabled]{opacity:.45;box-shadow:none;transform:none}
input{font:inherit;width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);-webkit-user-select:text;user-select:text;margin-bottom:10px}
/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:13px;color:var(--muted)}
.hud b{color:var(--ink);font-weight:700;font-size:15px}
.mult{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;color:var(--ink)}
.mult.x2{border-color:var(--blue);color:var(--blue)}.mult.x3{border-color:var(--gold);color:var(--gold)}
.board{display:flex;gap:5px;margin:0 0 18px}
.board i{flex:1;height:8px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.board i b{position:absolute;inset:0;right:auto;background:var(--accent);width:0;transition:width .3s}
.board i.done b{background:var(--gold);width:100%}
.board i.cur{outline:1px solid var(--accent)}
.blk{font-size:13px;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between}
/* cards */
.stack{position:relative;min-height:150px;margin:0 0 16px}
.qcard{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:22px 20px;font-size:21px;font-weight:600;line-height:1.35;min-height:150px;display:flex;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:dealIn .28s cubic-bezier(.2,.8,.2,1)}
.qcard.out{animation:dealOut .22s ease-in forwards}
.ghostcard{position:absolute;left:10px;right:10px;top:8px;bottom:-8px;border-radius:18px;background:var(--card);border:1px solid var(--line);z-index:-1;opacity:.6}
@keyframes dealIn{0%{transform:translateY(24px) scale(.96);opacity:0}100%{transform:none;opacity:1}}
@keyframes dealOut{0%{transform:none;opacity:1}100%{transform:translateX(60px) rotate(4deg);opacity:0}}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-size:16px;line-height:1.35;transition:transform .08s,border-color .12s,background .12s}
.opt:active{transform:scale(.98)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt[disabled]{opacity:.5;cursor:default}
.opt.sel{background:var(--sel);border-color:var(--accent)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale .opt{text-align:center;padding:14px 4px 12px;font-size:13px;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:6px}
.scale .opt em{font-style:normal;font-size:20px;font-weight:700;color:var(--muted)}
.scale .opt:nth-child(1) em{color:var(--warn)}.scale .opt:nth-child(5) em{color:var(--accent)}
@media (max-width:420px){.scale{grid-template-columns:repeat(5,1fr)}.scale .opt{font-size:11.5px;padding:12px 2px 10px}}
.hint{font-size:13px;color:var(--muted);margin-top:14px;display:flex;justify-content:space-between;align-items:center}
.ring{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:conic-gradient(var(--accent) var(--p,100%),var(--line) 0);position:relative}
.ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
.ring span{position:relative;z-index:1}
.ring.low{background:conic-gradient(var(--warn) var(--p,100%),var(--line) 0)}
/* interstitials */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin:12px 0;animation:dealIn .3s ease-out}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:700;color:var(--accent)}.stat span{font-size:12px;color:var(--muted)}
.deal{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--gold);border-radius:14px;padding:12px 14px;margin:10px 0}
.deal i{width:38px;height:38px;border-radius:50%;background:var(--gold);color:#3b2a00;display:grid;place-items:center;font-style:normal;font-weight:700;flex:none}
.badge{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.badge:last-child{border-bottom:0}
.badge i{width:40px;height:40px;border-radius:50%;background:var(--gold);color:#3b2a00;display:grid;place-items:center;font-style:normal;font-weight:700;flex:none}
.badge i.off{background:var(--line);color:var(--muted)}
.badge b{display:block;font-weight:600}.badge span{font-size:13px;color:var(--muted)}
.map{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.map span{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.map span.fc{border-color:var(--blue);color:var(--blue)}.map span.sj{border-color:var(--gold);color:var(--gold)}
.xp{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--gold);color:#3b2a00;font-weight:700;padding:5px 11px;border-radius:999px;font-size:14px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:5}
.xp.show{opacity:1;transform:translateY(0)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);background:var(--card2);border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:5}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.confetti i{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;animation:fall 1.4s ease-in forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(105vh) rotate(540deg);opacity:.2}}
code.tok{display:block;word-break:break-all;font-size:11px;line-height:1.4;padding:12px;background:var(--card);border-radius:8px;-webkit-user-select:all;user-select:all;font-family:ui-monospace,Menlo,Consolas,monospace}

/* journey map */
.journey{margin:14px 0 4px}
.journey svg{width:100%;height:auto;display:block}
.journey .node{fill:var(--card);stroke:var(--line);stroke-width:2}
.journey .node.fc{stroke:var(--blue)}.journey .node.sj{stroke:var(--gold)}.journey .node.done{fill:var(--gold);stroke:var(--gold)}.journey .node.cur{stroke:var(--accent);stroke-width:3}
.journey text{font-size:11px;fill:var(--muted);font-family:inherit}
.journey path.road{stroke:var(--line);stroke-width:3;fill:none;stroke-dasharray:6 6}
.journey path.road.lit{stroke:var(--accent);stroke-dasharray:none;stroke-dashoffset:600;animation:draw 1.2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
/* progress ring in HUD */
.pring{width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--accent) var(--p,0%),var(--line) 0);display:grid;place-items:center;position:relative;flex:none}
.pring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg)}
.pring span{position:relative;z-index:1;font-size:11px;font-weight:700;color:var(--ink)}
.flame{display:inline-block;transform-origin:50% 100%}
.mult.x2 .flame,.mult.x3 .flame{animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.18) rotate(4deg)}}
/* ripple */
.opt{position:relative;overflow:hidden}
.opt::after{content:"";position:absolute;left:var(--x,50%);top:var(--y,50%);width:0;height:0;border-radius:50%;background:rgba(56,194,176,.35);transform:translate(-50%,-50%);opacity:0}
.opt.rip::after{animation:rip .45s ease-out}
@keyframes rip{0%{width:0;height:0;opacity:.8}100%{width:420px;height:420px;opacity:0}}
/* funnel infographic */
.funnel{display:flex;flex-direction:column;gap:6px;margin:14px 0 6px}
.funnel div{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.funnel b{height:14px;border-radius:7px;background:var(--accent);display:block;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.funnel div:nth-child(2) b{background:var(--blue)}.funnel div:nth-child(3) b{background:var(--gold)}
.funnel span{min-width:92px}.funnel em{font-style:normal;color:var(--ink);font-weight:600;min-width:28px;text-align:right}
.bump{animation:bump .4s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div class="xp" id="xp">+10</div>
<div class="toast" id="toast"></div>
<div class="confetti" id="confetti"></div>
<script>
const L = [["p1","If I see something that can be fixed, I fix it without waiting to be asked."],["p2","I am constantly looking for better ways to reach my targets."],["p3","I tend to wait for my manager to tell me what to do next."],["p4","When something blocks me, I find a way around it rather than escalating and waiting."],["p5","I have started initiatives at work that nobody asked me to start."],["p7","I spot opportunities before most people around me notice them."],["a1","I set targets for myself that are higher than what is expected of me."],["a2","Hitting a target feels good for about a day, then I want the next one."],["a3","I am satisfied doing a reasonable job; I do not need to be the best."],["a4","I keep working on a goal even when the reward for it is uncertain."],["a6","I would rather have a demanding role with big upside than a comfortable one with steady pay."],["a7","Closing a deal I was told was impossible is one of the best feelings I know."],["c1","I enjoy competing against colleagues on a leaderboard."],["c2","I regularly check how my numbers compare with the top performer on the team."],["c3","Competition makes me perform better, not worse."],["c4","I do not care much whether I finish first or fifth as long as I did well."],["c7","Competitive situations make me anxious rather than excited."],["c8","When a colleague wins big, my first reaction is to ask how they did it."],["y1","Winning matters more to me than how I win."],["y2","I find it hard to be glad when a colleague beats me."],["y3","Bending a rule a little is fine if it gets the deal done."],["y4","I sometimes keep useful information to myself so others do not gain an edge."],["y6","I would rather my team miss target than see someone else on it outscore me."],["g1","After ten rejections in a row, my energy on the eleventh call is the same as on the first."],["g2","Setbacks discourage me for days."],["g5","I take a no from a prospect as information, not as a judgement of me."],["g6","I finish what I start even after the initial excitement is gone."],["g7","I have bounced back from a month when I badly missed target and gone on to beat it."],["g8","When results are bad, I tend to reduce my activity rather than increase it."],["l1","My results depend mostly on what I do, not on the leads I am given."],["l2","Whether I hit target is largely out of my hands."],["l3","I can usually find a way to move a hesitant prospect."],["l4","Luck plays a bigger role in sales success than people admit."],["l5","Given a hard target, I am confident I will find a way to get there."],["o1","I often ask for feedback on my calls, even when it will be uncomfortable."],["o2","I would rather look competent than admit I am learning."],["o3","When I lose a deal, I break down exactly what went wrong before moving on."],["o4","I change my approach based on what worked and what did not last week."],["o5","I avoid tasks where I might look bad in front of others."],["s1","I have never been late for a commitment."],["s2","I have never told a small lie to avoid an awkward situation."],["s4","I have never felt irritated by a customer."],["s5","I have never taken credit for something a colleague did."],["s7","I have never pretended to be busier than I was."],["x1","To show you are reading carefully, choose Agree for this statement."],["x2","This is a check. Please select Strongly disagree."]];
const M = [["m1","I would rather spend an hour improving one rep's pitch than an hour closing a deal myself."],["m3","When a rep is struggling, my instinct is to take the lead over and close it myself."],["m4","I get real satisfaction from watching someone I trained beat my own numbers."],["m5","I hold people to the standard even when it makes me unpopular for a while."],["m6","I find it difficult to have a direct conversation with someone who is underperforming."],["m7","If the team misses target, I look first at what I failed to do, not at who let me down."],["m9","I still take calls or join deals myself when the team needs it, without seeing it as beneath the role."],["m11","Once I am a manager, I expect to stop doing the frontline work entirely."],["m12","I am at my best in the middle of the action, not reviewing dashboards from a distance."],["m13","My own leaderboard position matters less to me than the team's total."],["m14","I share my best techniques openly, even with people who might outscore me as a result."],["m15","I would be uncomfortable if a rep on my team became more respected than me."]];
const FC = [["I push for the close even when it feels uncomfortable","I make sure the customer never feels pressured"],["I set my own targets above what is asked","I make sure I deliver exactly what was agreed"],["I keep going long after most people would stop","I know when to cut losses and move on"],["I check the leaderboard several times a day","I focus on my own work and ignore rankings"],["I would rather be the best on the team","I would rather the whole team does well"],["I change my pitch mid call when I sense it is not landing","I keep to the script because it was designed for a reason"],["When I miss target I increase my call volume","When I miss target I step back and plan carefully"],["I would rather have a big variable and a small fixed pay","I would rather have a predictable salary"]];
const SJ = [{"q":"It is the 28th of the month. You are at 70 percent of target. Your manager is on leave and the two hottest leads in your pipeline have gone quiet after a demo. What do you do first?","o":[["Call both quiet leads now, then work the next ten leads down the list before lunch."],["Send a follow up message to both and wait for a reply before deciding on next steps."],["Ask a senior colleague to review the demo recordings before you re contact them."],["Focus on fresh leads instead, since quiet leads after a demo rarely convert."]]},{"q":"A colleague on the leaderboard asks you how you handle a specific price objection that you have become good at. They are 2 units behind you with three days left in the month.","o":[["Share the approach fully. Their result does not change what you can do."],["Give a general answer and keep the specific line you use to yourself."],["Share it after the month closes."],["Offer to sit in on their next call and coach them live."]]},{"q":"You have just had 14 consecutive calls end in a no or no answer. It is 4 pm.","o":[["Take five minutes, listen to one of your own successful calls, then dial the next lead."],["Stop calling for the day and prepare better for tomorrow."],["Switch to sending WhatsApp messages instead, since calls are clearly not working today."],["Ask your manager whether the lead quality has changed."]]},{"q":"A prospect is ready to pay but wants a discount the creator has not approved. The month closes tomorrow.","o":[["Tell them the price is fixed, explain the value again, and ask what would make it worth full price to them."],["Promise the discount and sort it out with the creator afterwards."],["Offer a small extra like a bonus session that you know is within your authority."],["Let the deal slip to next month while you seek approval."]]}];

const SCALE=[["1","Not me"],["2","Rarely"],["3","Sometimes"],["4","Often"],["5","That's me"]];
const MIN_MS=900;          // answers before this are not accepted
const FC_SECONDS=12;       // split decision countdown
const XP={answer:10,block:60,finish:200};
const app=document.getElementById("app"),xpEl=document.getElementById("xp"),toastEl=document.getElementById("toast");
const state={role:"agent",name:"",email:"",blocks:[],bi:0,i:0,ans:{},lat:{},order:[],blur:0,start:0,t0:0,done:false,xp:0,streak:0,best:0,deals:0,timer:null};
window.addEventListener("blur",()=>{if(state.start&&!state.done){state.blur++;state.streak=0;}});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&state.start&&!state.done){state.blur++;state.streak=0;}});
document.addEventListener("contextmenu",e=>{if(state.start&&!state.done)e.preventDefault();});

function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
const mult=()=>state.streak>=16?3:state.streak>=8?2:1;
function gainXp(n){state.xp+=n;xpEl.textContent="+"+n;xpEl.classList.add("show");setTimeout(()=>xpEl.classList.remove("show"),650);}
function toast(t){toastEl.textContent=t;toastEl.classList.add("show");setTimeout(()=>toastEl.classList.remove("show"),1300);}
function confetti(){const c=document.getElementById("confetti");c.innerHTML="";const cols=["#ffc850","#2ee6a6","#5aa9ff","#ff7a59","#ffffff"];for(let i=0;i<70;i++){const s=document.createElement("i");s.style.left=Math.random()*100+"%";s.style.background=cols[i%cols.length];s.style.animationDelay=(Math.random()*.5)+"s";s.style.animationDuration=(1.1+Math.random()*.8)+"s";c.appendChild(s);}setTimeout(()=>c.innerHTML="",2400);}

function build(){
  const seed=Date.now()^Math.floor(Math.random()*1e9);const r=rng(seed);state.seed=seed;
  const st=shuffle(L.concat(state.role==="manager"?M:[]).map(x=>({k:"L",id:x[0]})),r);
  const fcs=shuffle(FC.map((p,i)=>({k:"F",id:"f"+i,flip:r()<0.5})),r);
  const sjs=SJ.map((s,i)=>({k:"S",id:"j"+i,ord:shuffle([0,1,2,3],r)}));
  // interleave: statements in chunks of ~11, split decisions and situations between them
  const n=st.length,chunks=state.role==="manager"?5:4,size=Math.ceil(n/chunks);
  const parts=[];for(let i=0;i<n;i+=size)parts.push(st.slice(i,i+size));
  const half=Math.ceil(fcs.length/2);const fcA=fcs.slice(0,half),fcB=fcs.slice(half);const sjA=sjs.slice(0,2),sjB=sjs.slice(2);
  const blocks=[];const wk=i=>({t:"L",name:"Week "+(i+1),sub:"Calls on the floor",items:parts[i]});
  blocks.push(wk(0),{t:"F",name:"Pitch night",sub:"Split decisions, "+FC_SECONDS+" seconds each",items:fcA});
  blocks.push(wk(1),{t:"S",name:"Deal desk",sub:"What would you do first?",items:sjA});
  blocks.push(wk(2),{t:"F",name:"Pitch night, round 2",sub:"Split decisions, "+FC_SECONDS+" seconds each",items:fcB});
  for(let i=3;i<parts.length;i++)blocks.push(wk(i));
  blocks.push({t:"S",name:"Closing day",sub:"Two last calls",items:sjB});
  state.blocks=blocks.filter(b=>b.items.length);state.bi=0;state.i=0;
}
const total=()=>state.blocks.reduce((t,b)=>t+b.items.length,0);
function journey(names,cur){
  const n=names.length,W=520,H=110,pad=26,step=(W-pad*2)/(n-1);
  const pts=names.map((_,i)=>[pad+i*step,i%2?38:72]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" ");
  const litTo=Math.max(0,Math.min(cur,n-1));const lit=pts.slice(0,litTo+1).map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" ");
  return `<div class="journey"><svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><path class="road" d="${d}"/>${litTo>0?`<path class="road lit" d="${lit}"/>`:""}${pts.map((p,i)=>`<circle class="node ${names[i][1]} ${i<cur?"done":i===cur?"cur":""}" cx="${p[0]}" cy="${p[1]}" r="9"/><text x="${p[0]}" y="${p[1]+(i%2?-16:24)}" text-anchor="middle">${names[i][0]}</text>`).join("")}</svg></div>`;
}
function countUp(el,to,ms=600){const from=+el.dataset.from||0;const t0=performance.now();const step=()=>{const k=Math.min(1,(performance.now()-t0)/ms);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step);};step();}

function intro(){
  if(location.hash.includes("manager"))state.role="manager";
  const mgr=state.role==="manager";
  app.innerHTML=`<h1>First Month</h1>
  <p>Play through your first month on the Topmate sales floor. About ${mgr?"12":"10"} minutes, ${mgr?"nine":"eight"} short blocks, the format changes every few minutes.</p>
  <div class="card"><p style="margin-bottom:6px"><strong>How you score</strong></p>
  <p class="muted" style="margin-bottom:6px">Every answer is a call made. Every block finished is a deal closed. Steady, attentive answering builds a streak that multiplies your points up to 3x. Points are for playing, never for what you answer.</p>
  ${journey([["Week 1",""],["Pitch night","fc"],["Week 2",""],["Deal desk","sj"],["Week 3",""],["Pitch night 2","fc"],["Week 4",""]].concat(mgr?[["Week 5",""]]:[]).concat([["Closing day","sj"]]),0)}</div>
  <div class="card"><p style="margin-bottom:6px"><strong>House rules</strong></p>
  <p class="muted" style="margin-bottom:6px">Answer as you really are. Describing an ideal instead of yourself is detectable and costs more than any honest answer.</p>
  <p class="muted" style="margin:0">No going back, and stay on this tab: leaving resets your streak and is recorded.</p></div>
  <input id="nm" autocomplete="off" placeholder="Your full name, as on your application">
  <input id="em" autocomplete="off" inputmode="email" placeholder="Email (optional)">
  <button class="primary" id="go" disabled>Clock in</button>`;
  const nm=document.getElementById("nm"),go=document.getElementById("go");
  nm.addEventListener("input",()=>go.disabled=nm.value.trim().length<2);
  go.onclick=()=>{state.name=nm.value.trim();state.email=document.getElementById("em").value.trim();build();state.start=Date.now();blockCard();};
}

function blockCard(){
  const b=state.blocks[state.bi];const icon=b.t==="F"?"&#9889;":b.t==="S"?"&#9742;":"&#9679;";
  app.innerHTML=`${hud()}<div class="card"><p class="muted" style="margin-bottom:4px">Block ${state.bi+1} of ${state.blocks.length}</p><h2>${icon} ${b.name}</h2><p>${b.sub}. ${b.items.length} ${b.t==="L"?"quick reads":b.t==="F"?"pairs":"situations"}.</p>
  ${b.t==="L"?`<p class="muted">Tap the number that fits. 1 is not me, 5 is that's me. Go with your gut; the streak rewards reading, not speed.</p>`:b.t==="F"?`<p class="muted">Two good options, one pick. When the ring runs out the pair is skipped.</p>`:`<p class="muted">Pick what you would actually do first, not what sounds best. No clock here.</p>`}
  <button class="primary" id="go">${state.bi===0?"Start week 1":"Go"}</button></div>`;
  document.getElementById("go").onclick=render;
}
function dealCard(){
  const b=state.blocks[state.bi];state.deals++;const last=state.bi>=state.blocks.length-1;
  gainXp(XP.block*mult());confetti();
  const calls=state.order.length,attentive=Object.values(state.lat).filter(v=>v>=1400&&v<=35000).length;
  app.innerHTML=`${hud()}<div class="card"><div class="deal bump"><i>&#10003;</i><div><b>Deal closed</b><br><span class="muted">${b.name} done. ${state.deals} of ${state.blocks.length} on the board.</span></div></div>
  ${journey(state.blocks.map(x=>[x.name.replace(", round 2"," 2"),x.t==="F"?"fc":x.t==="S"?"sj":""]),state.bi+1)}
  <div class="stat"><div><b class="cu" data-to="${state.xp}" data-from="${state.xp-XP.block*mult()}">0</b><span>points</span></div><div><b>x${mult()}</b><span>multiplier</span></div><div><b class="cu" data-to="${Math.round(calls/total()*100)}">0</b><span>% of month</span></div></div>
  <div class="funnel"><div><span>Calls made</span><b style="width:${Math.round(calls/total()*100)}%"></b><em>${calls}</em></div><div><span>Read properly</span><b style="width:${Math.round(attentive/total()*100)}%"></b><em>${attentive}</em></div><div><span>Deals closed</span><b style="width:${Math.round(state.deals/state.blocks.length*100)}%"></b><em>${state.deals}</em></div></div>
  <p class="muted">${state.streak>=16?"On fire. Keep the streak and every answer pays triple.":state.streak>=8?"Streak is building. Eight more attentive answers for x3.":"Steady reading builds the streak. Eight in a row unlocks x2."}</p>
  <button class="primary" id="go">${last?"See your month":"Next: "+state.blocks[state.bi+1].name}</button></div>`;
  app.querySelectorAll(".cu").forEach(e=>countUp(e,+e.dataset.to));
  document.getElementById("go").onclick=()=>{if(last)finish();else{state.bi++;state.i=0;blockCard();}};
}

function hud(){
  const segs=state.blocks.map((b,i)=>{const d=i<state.bi?b.items.length:i>state.bi?0:state.i;return`<i class="${d>=b.items.length?"done":i===state.bi?"cur":""}"><b style="width:${Math.round(d/b.items.length*100)}%"></b></i>`;}).join("");
  const pct=Math.round(state.order.length/total()*100);
  return`<div class="hud"><div class="pring" style="--p:${pct}%"><span>${pct}%</span></div><span><b id="xpv">${state.xp}</b> pts</span><span class="mult x${mult()}"><i class="flame">${mult()>1?"&#128293;":"&#9679;"}</i> x${mult()} &middot; ${state.streak}</span><span><b>${state.deals}</b> deals</span></div><div class="board">${segs}</div>`;
}

function render(){
  const b=state.blocks[state.bi];
  if(state.i>=b.items.length){dealCard();return;}
  const it=b.items[state.i];let body="",timer="";
  if(it.k==="L"){const item=L.concat(M).find(x=>x[0]===it.id);
    body=`<div class="stack"><div class="ghostcard"></div><div class="qcard" id="qc">${esc(item[1])}</div></div><div class="opts scale">${SCALE.map(([v,t])=>`<button class="opt" data-v="${v}"><em>${v}</em>${t}</button>`).join("")}</div>`;}
  else if(it.k==="F"){const p=FC[+it.id.slice(1)];const a=it.flip?[p[1],p[0]]:[p[0],p[1]];
    body=`<div class="stack"><div class="ghostcard"></div><div class="qcard" id="qc" style="font-size:19px">Which is more you?</div></div><div class="opts">${a.map((t,i)=>`<button class="opt" data-v="${it.flip?(i===0?"b":"a"):(i===0?"a":"b")}">${esc(t)}</button>`).join("")}</div>`;
    timer=`<div class="ring" id="ring"><span>${FC_SECONDS}</span></div>`;}
  else{const s=SJ[+it.id.slice(1)];
    body=`<div class="stack"><div class="ghostcard"></div><div class="qcard" id="qc" style="font-size:18px;font-weight:500">${esc(s.q)}</div></div><div class="opts">${it.ord.map(oi=>`<button class="opt" data-v="${oi}">${esc(s.o[oi][0])}</button>`).join("")}</div>`;}
  app.innerHTML=`${hud()}<div class="blk"><span>${esc(b.name)}</span><span>${state.i+1} of ${b.items.length}</span></div>${body}<div class="hint"><span>${it.k==="L"?"Gut answer. No right one.":it.k==="F"?"Both are fine. Which is more true?":"Think it through."}</span>${timer}</div>`;
  state.t0=performance.now();
  const btns=[...app.querySelectorAll(".opt")];btns.forEach(x=>x.disabled=true);
  setTimeout(()=>btns.forEach(x=>x.disabled=false),MIN_MS);
  clearInterval(state.timer);
  if(it.k==="F"){const ring=document.getElementById("ring");state.timer=setInterval(()=>{const left=FC_SECONDS-(performance.now()-state.t0)/1000;if(left<=0){clearInterval(state.timer);state.lat[it.id]=FC_SECONDS*1000;state.order.push(it.id);state.streak=0;toast("Skipped");state.i++;render();return;}ring.style.setProperty("--p",Math.round(left/FC_SECONDS*100)+"%");ring.querySelector("span").textContent=Math.ceil(left);if(left<4)ring.classList.add("low");},150);}
  btns.forEach(x=>x.onclick=(ev)=>{
    const lat=Math.round(performance.now()-state.t0);if(lat<MIN_MS)return;
    if(ev&&ev.clientX){const rc=x.getBoundingClientRect();x.style.setProperty("--x",(ev.clientX-rc.left)+"px");x.style.setProperty("--y",(ev.clientY-rc.top)+"px");}x.classList.add("rip");
    clearInterval(state.timer);x.classList.add("sel");btns.forEach(y=>y.disabled=true);
    state.ans[it.id]=x.dataset.v;state.lat[it.id]=lat;state.order.push(it.id);
    const before=mult();
    if(lat>=1400&&lat<=35000){state.streak++;state.best=Math.max(state.best,state.streak);}else{if(state.streak>=8)toast("Streak lost");state.streak=0;}
    if(mult()>before)toast("x"+mult()+" multiplier");
    gainXp(XP.answer*mult());
    const qc=document.getElementById("qc");if(qc)qc.classList.add("out");
    setTimeout(()=>{state.i++;render();},200);
  });
}

async function finish(){
  state.done=true;clearInterval(state.timer);gainXp(XP.finish);confetti();
  const payload={v:3,n:state.name,e:state.email,r:state.role,seed:state.seed,t:Date.now()-state.start,b:state.blur,a:state.ans,l:state.lat,o:state.order,xp:state.xp,best:state.best};
  const mins=Math.max(1,Math.round(payload.t/60000));
  const badges=[["Month closed","Finished every block",true],["Locked in","A streak of 20 or more attentive answers",state.best>=20],["Never left the floor","Stayed on the page throughout",state.blur===0],["Beat the clock","No split decision skipped",FC.every((p,i)=>("f"+i) in state.ans)]];
  const shell=(status)=>`<div class="card"><p class="muted" style="margin-bottom:4px">Month complete</p><h2>Well played, ${esc(state.name.split(" ")[0])}</h2>
  <div class="stat"><div><b class="cu" data-to="${state.xp}">0</b><span>points</span></div><div><b class="cu" data-to="${state.best}">0</b><span>best streak</span></div><div><b class="cu" data-to="${mins}">0</b><span>minutes</span></div></div>
  ${badges.map(b=>`<div class="badge"><i class="${b[2]?"":"off"}">${b[2]?"&#10003;":"&ndash;"}</i><div><b>${b[0]}</b><span>${b[1]}</span></div></div>`).join("")}
  <div id="status" style="margin-top:14px">${status}</div>
  <p class="muted" style="margin:14px 0 0">Your profile goes to the hiring panel alongside your interview. Nothing is decided on this game alone.</p></div>`;
  app.innerHTML=shell(`<p class="muted">Saving your month</p>`);app.querySelectorAll(".cu").forEach(e=>countUp(e,+e.dataset.to,900));
  try{const r=await fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw new Error(j.error||"failed");
    document.getElementById("status").innerHTML=`<p style="margin:0"><strong>Saved.</strong> Your reference is <strong>${j.ref}</strong>. You can close this page.</p>`;}
  catch(e){const tok=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    document.getElementById("status").innerHTML=`<p><strong>Could not save automatically.</strong> Copy this code and send it to the person who shared the link.</p><code class="tok">${tok}</code>`;}
}
window.addEventListener("hashchange",()=>{if(!state.start)intro();});
intro();
</script>
</body>
</html>
