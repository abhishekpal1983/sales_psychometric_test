<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sales Profile Evaluator</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ffffff;--ink:#1f2933;--muted:#6b7280;--line:#e2e6ea;--panel:#f5f7f9;--accent:#0f5f6b;--accent-ink:#fff;--warn:#b45309;--bad:#b91c1c;--good:#166534}
@media (prefers-color-scheme:dark){:root{--bg:#141a1f;--ink:#e8edf1;--muted:#98a4ae;--line:#2a343c;--panel:#1b2329;--accent:#5fc3cf;--accent-ink:#0c1518}}
*{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
main{max-width:860px;margin:0 auto;padding:24px 20px 80px}
h1{font-size:24px;font-weight:600;margin:0 0 6px}h2{font-size:19px;font-weight:600;margin:26px 0 8px}h3{font-size:16px;font-weight:600;margin:16px 0 6px}
p{margin:0 0 12px}.muted{color:var(--muted);font-size:14px}button{font:inherit;cursor:pointer}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 18px;font-size:15px;font-weight:500}.primary[disabled]{opacity:.5}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 14px;font-size:14px}.danger{color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
textarea,input,select{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:90px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.panel{background:var(--panel);border-radius:10px;padding:16px 18px;margin:12px 0}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-weight:600;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.ok{color:var(--good);border-color:var(--good)}.warn{color:var(--warn);border-color:var(--warn)}.bad{color:var(--bad);border-color:var(--bad)}
.meter{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.meter i{display:block;height:100%;background:var(--accent)}
.sc{display:grid;grid-template-columns:190px 1fr 44px 120px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
@media (max-width:560px){.sc{grid-template-columns:1fr 44px;grid-template-areas:"a b" "c c" "d d"}.sc>span:first-child{grid-area:a}.sc>.meter{grid-area:c}.sc>strong{grid-area:b}.sc>em{grid-area:d}}
.sc em{font-style:normal;color:var(--muted);font-size:13px}
.flag{padding:9px 14px;border-left:3px solid var(--warn);background:var(--panel);margin:6px 0;font-size:14px;border-radius:0 8px 8px 0}.flag.bad{border-left-color:var(--bad)}.flag.ok{border-left-color:var(--good)}
.verdict{border:2px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}.verdict.ok{border-color:var(--good)}.verdict.warn{border-color:var(--warn)}.verdict.bad{border-color:var(--bad)}
.verdict .big{font-size:22px;font-weight:600;margin:0 0 4px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:12px 0 4px}.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted);font-size:15px}.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media (max-width:640px){.two{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
</style>
</head>
<body><main id="app"></main>
<script>
const app=document.getElementById("app");
let PW=sessionStorage.getItem("pw")||"",META=null,rows=[],view="roster",current=null;
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{"Content-Type":"application/json","X-Admin-Password":PW,...(opt.headers||{})}});if(r.status===401){PW="";sessionStorage.removeItem("pw");login("Wrong password.");throw new Error("auth");}return r;}

function login(msg){app.innerHTML=`<h1>Sales profile evaluator</h1><p class="muted">Private. Enter the admin password.</p><input id="pw" type="password" autocomplete="current-password"><div class="row"><button class="primary" id="go">Open</button><span class="muted">${msg||""}</span></div>`;
  const go=async()=>{PW=document.getElementById("pw").value;sessionStorage.setItem("pw",PW);await load();};document.getElementById("go").onclick=go;document.getElementById("pw").onkeydown=e=>{if(e.key==="Enter")go();};}
async function load(){try{if(!META)META=await (await api("/api/admin/meta")).json();rows=await (await api("/api/admin/results")).json();render();}catch(e){}}
if(PW)load();else login();

function render(){
  const tabs=`<div class="tabs">${["roster","add","validate"].map(t=>`<button class="${view===t?"on":""}" data-t="${t}">${{roster:"Participants",add:"Import a code",validate:"Validation"}[t]}</button>`).join("")}</div>`;
  let body=view==="roster"?(current?report(current):roster()):view==="add"?addForm():validate();
  app.innerHTML=`<h1>Sales profile evaluator</h1><p class="muted">${rows.length} participant${rows.length===1?"":"s"}. Results arrive here automatically when a candidate finishes. <a href="#" id="refresh">Refresh</a> · <a href="#" id="csv">Download all as CSV</a> · <a href="#" id="out">Sign out</a></p>${tabs}${body}`;
  app.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.t;current=null;render();});
  document.getElementById("refresh").onclick=e=>{e.preventDefault();load();};
  document.getElementById("out").onclick=e=>{e.preventDefault();PW="";sessionStorage.removeItem("pw");login();};
  document.getElementById("csv").onclick=async e=>{e.preventDefault();const r=await api("/api/admin/export.csv");const b=await r.blob();const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download="screener-results.csv";a.click();URL.revokeObjectURL(u);};
  wire();
}
function roster(){
  if(!rows.length)return`<div class="panel"><p style="margin:0">No results yet. Share the candidate link and results will appear here.</p></div>`;
  return`<div class="tbl"><table><tr><th>Name</th><th>Role</th><th>Taken</th><th>Result</th><th>Trust</th><th>Score</th><th>Tier</th></tr>
  ${rows.map(r=>`<tr class="click" data-id="${r.id}"><td><strong>${esc(r.name)}</strong>${r.email?`<br><span class="muted">${esc(r.email)}</span>`:""}</td><td>${r.role}</td><td>${new Date(r.taken_at).toLocaleDateString("en-IN",{day:"numeric",month:"short"})}</td><td><span class="pill ${r.scores.bandCls}">${r.scores.band}</span></td><td>${r.scores.validity}</td><td>${r.scores.validity==="Invalid"?"":r.scores.effComp.toFixed(1)}</td><td>${r.tier||""}</td></tr>`).join("")}</table></div>
  <p class="muted">Tap a row for the full report. Score is the champion composite out of 5 after any inflation adjustment.</p>`;
}
function addForm(){return`<p>Only needed if a candidate's result failed to save and they sent you the fallback code.</p><textarea id="tk" placeholder="eyJ2IjoyLCJu..."></textarea><div class="row"><button class="primary" id="run">Score and save</button><span class="muted" id="msg"></span></div>`;}
function wire(){
  app.querySelectorAll("tr.click").forEach(tr=>tr.onclick=()=>{current=rows.find(r=>r.id===tr.dataset.id);render();window.scrollTo(0,0);});
  const run=document.getElementById("run");if(run)run.onclick=async()=>{const msg=document.getElementById("msg");run.disabled=true;msg.textContent="Saving";
    try{const r=await api("/api/admin/import",{method:"POST",body:JSON.stringify({token:document.getElementById("tk").value})});const j=await r.json();if(!r.ok)throw new Error(j.error);await load();view="roster";render();}catch(e){msg.textContent=e.message||"Failed.";run.disabled=false;}};
  const back=document.getElementById("back");if(back)back.onclick=()=>{current=null;render();};
  const tier=document.getElementById("tier");if(tier)tier.onchange=async()=>{await api("/api/admin/results/"+current.id,{method:"PATCH",body:JSON.stringify({tier:tier.value})});current.tier=tier.value;};
  const del=document.getElementById("del");if(del)del.onclick=async()=>{if(!confirm("Delete "+current.name+"'s result? This cannot be undone."))return;await api("/api/admin/results/"+current.id,{method:"DELETE"});current=null;await load();};
}
function report(r){
  const s=r.scores,{SCALES,PLAIN,PROBES,FC_N,SJ_MAX}=META;const keys=s.isMgr?["PA","AS","HC","GR","LS","LG","CO","SA","HO","TS"]:["PA","AS","HC","GR","LS","LG"];
  const sorted=s.compKeys.slice().sort((x,y)=>s.scales[y]-s.scales[x]);const top=sorted.slice(0,2),low=sorted.slice(-2).reverse();
  const level=v=>v>=4.3?"Very high":v>=3.8?"High":v>=3.2?"Average":v>=2.6?"Low":"Very low";
  const bar=(k,inv)=>{const v=s.scales[k];if(v==null)return"";const pct=Math.round((v-1)/4*100);return`<div class="sc"><span>${SCALES[k]}</span><div class="meter"><i style="width:${pct}%;${inv?"background:var(--warn)":""}"></i></div><strong>${v.toFixed(1)}</strong><em>${inv?(v>=3.5?"Concern":v>=2.5?"Watch":"Fine"):level(v)}</em></div>`;};
  return`<div class="row"><button class="ghost" id="back">All participants</button></div>
  <h2 style="margin-top:8px">${esc(r.name)} <span class="muted" style="font-weight:400">${r.role}, ${new Date(r.taken_at).toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"})}, ${r.minutes} min${r.email?", "+esc(r.email):""}</span></h2>
  <div class="verdict ${s.bandCls}"><p class="big">${s.band}</p><p style="margin:0">${s.meaning}</p></div>
  <h3>Can the answers be trusted? <span class="pill ${s.validity==="Valid"?"ok":s.validity==="Caution"?"warn":"bad"}">${s.validity}</span></h3>
  ${s.flags.length?s.flags.map(f=>`<div class="flag ${f[0]}">${f[1]}</div>`).join(""):`<div class="flag ok">Yes. Timing, attention checks, cross checks and the honesty items all look normal.</div>`}
  ${s.validity!=="Invalid"?`<h3>In one paragraph</h3><p>Strongest on <strong>${SCALES[top[0]]}</strong> (${PLAIN[top[0]]}) and <strong>${SCALES[top[1]]}</strong> (${PLAIN[top[1]]}). Weakest on <strong>${SCALES[low[0]]}</strong> (${PLAIN[low[0]]}) at ${s.scales[low[0]].toFixed(1)} of 5${s.scales[low[1]]<3.5?` and <strong>${SCALES[low[1]]}</strong> at ${s.scales[low[1]].toFixed(1)}`:""}. Hypercompetitiveness is ${s.scales.HY>=3.5?"a concern":s.scales.HY>=2.5?"worth watching":"not a concern"} at ${s.scales.HY.toFixed(1)}. On the parts that are hard to fake, they picked the champion option ${s.fc} of ${FC_N} times and scored ${s.sj} of ${SJ_MAX} on the situational questions.</p>`:""}
  <h3>Trait profile</h3>${keys.map(k=>bar(k,false)).join("")}${bar("HY",true)}
  <p class="muted" style="margin-top:8px">Composite ${s.comp.toFixed(2)}${s.effComp!==s.comp?`, adjusted to ${s.effComp.toFixed(2)} for inflation`:""}. Strong fit starts at 4.2, probable at 3.7. Hypercompetitiveness reads lower is better and is not in the composite.</p>
  <h3>Hard to fake components</h3><div class="two">
   <div class="panel"><div class="kv"><span>Forced choice, champion picks</span><strong>${s.fc} of ${FC_N}</strong></div><div class="kv"><span>Situational judgement</span><strong>${s.sj} of ${SJ_MAX}</strong></div><div class="kv"><span>Self rating vs forced choice gap</span><strong>${s.gap}</strong></div></div>
   <div class="panel"><div class="kv"><span>Perfection claims (honesty items)</span><strong>${s.sd} of 8</strong></div><div class="kv"><span>Average answer time</span><strong>${(s.med/1000).toFixed(1)} s</strong></div><div class="kv"><span>Left the page</span><strong>${r.left_page} times</strong></div></div></div>
  <p class="muted">Normal ranges: 7 or more champion picks is strong; 7 or more on situational is strong; gap under 0.18; under 4 perfection claims; 2.5 to 8 seconds per answer.</p>
  <h3>Ask in the interview</h3><div class="panel"><p><strong>${SCALES[low[0]]}</strong> (their weakest)<br>${PROBES[low[0]]}</p><p style="margin:0"><strong>${SCALES[top[0]]}</strong> (their strongest, to test the claim)<br>${PROBES[top[0]]}</p>${s.scales.HY>=2.5?`<p style="margin:12px 0 0"><strong>Hypercompetitiveness</strong><br>${PROBES.HY}</p>`:""}</div>
  <p class="muted">Strong answers name a date, a number and a person. Vague answers on a trait they rated highly are the clearest sign of an inflated profile.</p>
  <h3>Performance tier (current team only, for validation)</h3><select id="tier"><option value="">Not set</option>${["Top third","Middle third","Bottom third"].map(t=>`<option ${r.tier===t?"selected":""}>${t}</option>`).join("")}</select>
  <div class="row" style="margin-top:20px"><button class="ghost danger" id="del">Delete this result</button></div>`;
}
function validate(){
  const {SCALES}=META;const tiers=["Top third","Middle third","Bottom third"];const valid=rows.filter(r=>r.scores.validity!=="Invalid");const byTier=t=>valid.filter(r=>r.tier===t);
  if(!tiers.some(t=>byTier(t).length))return`<div class="panel"><p style="margin:0">Set a performance tier on each current team member's report (Top, Middle or Bottom third by revenue per lead) and this tab will show which traits actually separate your best people from the rest.</p></div>`;
  const keys=["PA","AS","HC","GR","LS","LG","HY","CO","SA","HO","TS"].filter(k=>valid.some(r=>k in r.scores.scales));
  const m=(t,k)=>{const v=byTier(t).map(r=>r.scores.scales[k]).filter(x=>x!=null);return v.length?mean(v):null;};
  const sdp=k=>{const all=valid.map(r=>r.scores.scales[k]).filter(x=>x!=null);const mu=mean(all);return Math.sqrt(mean(all.map(v=>(v-mu)**2)))||1;};
  const body=keys.map(k=>{const t=m("Top third",k),b=m("Bottom third",k),mid=m("Middle third",k);const d=(t!=null&&b!=null)?(t-b)/sdp(k):null;
    const read=d==null?"Need both tiers":Math.abs(d)>=0.8?"Large. Keep, full weight":Math.abs(d)>=0.5?"Moderate. Keep, half weight":Math.abs(d)>=0.2?"Small. Keep only if it also separates top from middle":"None. Drop from composite";
    return`<tr><td>${SCALES[k]}</td><td>${t==null?"":t.toFixed(2)}</td><td>${mid==null?"":mid.toFixed(2)}</td><td>${b==null?"":b.toFixed(2)}</td><td>${d==null?"":d.toFixed(2)}</td><td>${read}</td></tr>`;}).join("");
  const comp=t=>{const v=byTier(t).map(r=>r.scores.effComp);return v.length?mean(v).toFixed(2):"";};
  return`<p>Averages by performance tier, from ${valid.length} valid results (${tiers.map(t=>byTier(t).length+" "+t.toLowerCase()).join(", ")}). Effect size is top minus bottom in standard deviations.</p>
  <div class="tbl"><table><tr><th>Trait</th><th>Top</th><th>Middle</th><th>Bottom</th><th>Effect</th><th>What to do</th></tr>${body}<tr><td><strong>Composite</strong></td><td><strong>${comp("Top third")}</strong></td><td><strong>${comp("Middle third")}</strong></td><td><strong>${comp("Bottom third")}</strong></td><td></td><td>Lowest top third composite becomes the new Unlikely fit line; highest bottom third composite becomes the Strong fit line.</td></tr></table></div>
  <p class="muted">With around 40 people only effects of 0.8 and above are statistically safe. Read the direction and size, not significance.</p>`;
}
</script></body></html>
